# The virtual gamepad for Wolf4SDL (the launcher's docs/virtual-gamepad-plan.md; rc/pad.default.ini has the rest).
#
# Wolf4SDL reads raw joystick buttons and axes 0/1, and an Xbox 360 pad's triggers are axes, so L2 and R2
# could not be bound. Shown the PlayStation Classic's own layout instead - Triangle 0, Circle 1, Cross 2,
# Square 3, L2 4, R2 5, L1 6, R1 7, Select 8, Start 9, the D-pad on axes 0/1 - every pad plays as the console's
# does, and the defaults in patches/wolf4sdl/0001-psc-button-layout.patch fit it.
virtual = psc
