[app]
Title=Spear of Destiny (Demo)
Author=Wolf4SDL by Moritz Kroll and contributors; Spear of Destiny by id Software (FormGen), 1992
Version=20260504-2
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/spear on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances, bin/win/spear.exe on Windows. The launcher starts an App in
# its own folder: the game data, the settings (config.sdm) and the saves are all here (--configdir .).
Exec=bin/{key}/spear
# --res 960 600: three times the game's 320x200, which Wolf4SDL scales to the display itself, 4:3 corrected. (The
# 2020 port's --resf 1280 720 drew a 3x picture into the corner of a 1280x720 buffer and turned the 4:3
# correction off - the picture came out shifted and stretched.)
Args=--fullscreen --res 960 600 --configdir . --joystick 0
# Windows has no virtual pad: an XInput pad's D-pad is SDL's hat 0
Args.win=--fullscreen --res 960 600 --configdir . --joystick 0 --joystickhat 0
# SDL2 and SDL2_mixer are the launcher's (the console, Windows) or the system's - nothing of its own
# Wolf4SDL reads raw joystick buttons; pad.ini has the virtual pad show it the PlayStation Classic's own layout
VirtualPad=true
Kernel=false
